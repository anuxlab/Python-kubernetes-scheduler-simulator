# Small-scale test for quick validation of scheduling policies.
# Use this to ensure your simulation runs correctly before scaling up.
cluster:
  nodes:
    - name: node-1
      capacity: { cpu: 8.0, memory: 16.0, gpu: 1 }
    - name: node-2
      capacity: { cpu: 8.0, memory: 16.0, gpu: 0 }
    - name: node-3
      capacity: { cpu: 4.0, memory: 8.0, gpu: 0 }
    - name: node-4
      capacity: { cpu: 4.0, memory: 8.0, gpu: 0 }

workload:
  type: synthetic
  num_pods: 100
  inter_arrival: { type: exponential, mean: 2.0 }
  cpu: { type: uniform, min: 0.2, max: 1.5 }
  memory: { type: uniform, min: 0.5, max: 3.0 }
  gpu: { type: choice, values: [0, 0, 1] }          # 1/3 chance of 1 GPU
  gang_prob: 0.1
  gang_size: { type: uniform, min: 2, max: 3 }

simulation:
  policy: bestfit
  until: 1000.0
  log_interval: 50.0
  seed: 42
  runtime_function: default