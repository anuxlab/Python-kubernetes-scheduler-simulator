# GPU‑packing configuration for evaluating the gpupack policy.
# The cluster has nodes with varying GPU capacities, and the workload
# includes a high proportion of GPU‑requesting pods. The gpupack policy
# should concentrate these on nodes already using GPUs, leaving CPU‑only
# nodes for non‑GPU workloads.
cluster:
  nodes:
    # GPU‑heavy nodes
    - name: gpu-node-1
      capacity: { cpu: 16.0, memory: 32.0, gpu: 4 }
    - name: gpu-node-2
      capacity: { cpu: 16.0, memory: 32.0, gpu: 4 }
    - name: gpu-node-3
      capacity: { cpu: 16.0, memory: 32.0, gpu: 2 }
    - name: gpu-node-4
      capacity: { cpu: 16.0, memory: 32.0, gpu: 2 }
    # CPU‑only nodes for non‑GPU pods
    - name: cpu-node-1
      capacity: { cpu: 32.0, memory: 64.0, gpu: 0 }
    - name: cpu-node-2
      capacity: { cpu: 32.0, memory: 64.0, gpu: 0 }
    - name: cpu-node-3
      capacity: { cpu: 32.0, memory: 64.0, gpu: 0 }

workload:
  type: synthetic
  num_pods: 300
  inter_arrival: { type: exponential, mean: 1.2 }
  cpu: { type: uniform, min: 0.5, max: 2.0 }
  memory: { type: uniform, min: 1.0, max: 4.0 }
  # High GPU probability: 30% 1 GPU, 10% 2 GPUs, 60% 0
  gpu: { type: choice, values: [0, 0, 0, 0, 0, 0, 1, 1, 1, 2] }
  gang_prob: 0.0                         # No gangs, to isolate GPU packing effect
  gang_size: { type: constant, value: 1 }

simulation:
  policy: gpupack
  until: 4000.0
  log_interval: 100.0
  seed: 4567
  runtime_function: default              # exponential(mean=60)