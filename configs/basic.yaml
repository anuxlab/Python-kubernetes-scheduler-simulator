# Basic minimal configuration for testing the simulation framework.
# Use this to verify that everything works before moving to larger experiments.
cluster:
  nodes:
    - name: node-1
      capacity: { cpu: 4.0, memory: 8.0, gpu: 1 }
    - name: node-2
      capacity: { cpu: 4.0, memory: 8.0, gpu: 0 }
    - name: node-3
      capacity: { cpu: 4.0, memory: 8.0, gpu: 0 }

workload:
  type: synthetic
  num_pods: 50
  inter_arrival: { type: exponential, mean: 1.5 }
  cpu: { type: uniform, min: 0.2, max: 1.0 }
  memory: { type: uniform, min: 0.5, max: 2.0 }
  gpu: { type: choice, values: [0, 0, 1] }   # 1/3 chance of 1 GPU
  gang_prob: 0.0                              # no gangs
  gang_size: { type: constant, value: 1 }    # ignored

simulation:
  policy: bestfit
  until: 500.0
  log_interval: 50.0
  seed: 123
  runtime_function: default